name: Straylight

options:
  bundleIdPrefix: as.banast
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    MARKETING_VERSION: 1.0.2
    CURRENT_PROJECT_VERSION: 5
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: F87BNUZAVJ
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    # Local builds stay ad-hoc signed so they work on any machine.
    Debug:
      CODE_SIGN_IDENTITY: "-"
    # Releases are notarized, which needs Developer ID plus a secure timestamp.
    Release:
      CODE_SIGN_IDENTITY: Developer ID Application
      OTHER_CODE_SIGN_FLAGS: --timestamp

packages:
  StraylightKit:
    path: Packages/StraylightKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Straylight:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: StraylightKit
      - package: Sparkle
      - sdk: CoreWLAN.framework
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleName: straylight
        CFBundleDisplayName: straylight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSHumanReadableCopyright: © 2026 Bill Anastas
        # Sparkle. Checks daily without asking first; the private half of
        # SUPublicEDKey lives in the release machine's keychain (account "straylight").
        SUFeedURL: https://straylight.banast.as/appcast.xml
        SUPublicEDKey: sWaDm5zWOzYHu/tyhMKenacCr46WFyyfzooV69HFLoE=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_NAME: straylight
        PRODUCT_BUNDLE_IDENTIFIER: as.banast.straylight
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
